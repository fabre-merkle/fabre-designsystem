name: Storybook tests

# Runs the @workspace/ui Storybook interaction (play) + a11y tests on every PR.
# Pairs with @focus/storybook-core (the workshop) and @focus/skill-storybook-author.
on:
  pull_request:
    paths:
      - "packages/ui/**"
      - ".github/workflows/storybook.yml"

jobs:
  storybook-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: packages/ui

      - name: Run Storybook tests (interaction + a11y)
        run: bun run test-storybook
        working-directory: packages/ui
