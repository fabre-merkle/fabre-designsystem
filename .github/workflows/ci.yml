name: CI

# Lint, typecheck, and build the monorepo on every pull request (and on push to
# the default branch). Assumes a Bun + Turborepo workspace with Biome for
# lint/format, TypeScript for typecheck, and a top-level `build` task.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Biome lint + format check (no writes). Fails on any lint error or
      # unformatted file across the workspace.
      - name: Lint & format check
        run: bunx --bun @biomejs/biome ci .

      # TypeScript typecheck across all workspaces (Turbo fans out the `check-types`
      # task; each package runs `tsc --noEmit`; Next apps run
      # `next typegen` first, since `next-env.d.ts` is gitignored).
      - name: Type check
        run: bun run check-types

      # Build every app/package (Turbo caches per-task).
      - name: Build
        run: bun run build
